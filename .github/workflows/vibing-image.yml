---
name: "Build Vibing Content image"

# Builds the production image (the same Dockerfile upstream uses for its
# ghcr.io image) and publishes it to ghcr.io/vibingcontent/vibingcontent,
# tagged with the short commit SHA and `latest`. Build steps only.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vibing-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    if: github.repository == 'vibingcontent/vibingcontent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # The image is ~7 GB and BuildKit keeps a second copy of its layers
      # while exporting, more than the free space of a standard runner.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Short commit SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.sha.outputs.short }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Vibing Content
            org.opencontainers.image.description=Vibing Content, based on Postiz
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disk usage after build
        if: always()
        run: df -h /
